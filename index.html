<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Skóre" />
  <meta name="theme-color" content="#0f172a" />
  <title>Padel & Tenis Skóre</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/github/explore/80688e429a7d4ef2fca1e82350fe8e3517d3494d/topics/android/android.png" />
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #22c55e;
      --p1: #2563eb;
      --p2: #dc2626;
    }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    .app {
      display: flex; flex-direction: column;
      width: 100vw; height: 100vh;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    /* Horní lišta */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px; background: var(--panel);
      border-bottom: 1px solid #334155; gap: 6px; flex-wrap: wrap;
      z-index: 10;
    }
    .sets-bar {
      display: flex; align-items: center; gap: 10px;
      font-size: 1.1rem; font-weight: 700; background: #0f172a;
      padding: 6px 12px; border-radius: 10px; border: 1px solid #334155;
    }
    .btn {
      background: #334155; color: #fff; border: none;
      padding: 8px 11px; border-radius: 8px; font-size: 0.85rem;
      font-weight: 600; cursor: pointer; display: inline-flex;
      align-items: center; gap: 5px;
    }
    .btn:active { transform: scale(0.96); }
    .btn-green { background: #16a34a; }
    .btn-red { background: #dc2626; }
    .btn-blue { background: #2563eb; }

    /* Hlavní hřiště - 2 velké poloviny */
    .court {
      flex: 1; display: flex; flex-direction: row;
      width: 100%; position: relative; overflow: hidden;
    }
    @media (orientation: portrait) {
      .court { flex-direction: column; }
    }
    .half {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      position: relative; cursor: pointer;
      transition: filter 0.1s ease;
      padding: 16px;
    }
    .half:active { filter: brightness(1.18); }
    .half-p1 { background: var(--p1); }
    .half-p2 { background: var(--p2); }

    .player-header {
      position: absolute; top: 14px; left: 16px; right: 16px;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 1.25rem; font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,0.4);
      pointer-events: none;
    }
    .games-badge {
      background: rgba(0,0,0,0.35); padding: 4px 12px;
      border-radius: 999px; font-size: 1.1rem;
    }
    .big-score {
      font-size: clamp(5.5rem, 22vw, 11rem);
      font-weight: 900; line-height: 1;
      text-shadow: 0 4px 14px rgba(0,0,0,0.45);
      pointer-events: none;
    }
    .tap-hint {
      position: absolute; bottom: 12px;
      font-size: 0.8rem; opacity: 0.75; pointer-events: none;
    }

    /* Spodní lišta */
    .bottombar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px; background: var(--panel);
      border-top: 1px solid #334155; gap: 8px; z-index: 10;
    }

    /* Modální okna */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      display: none; align-items: center; justify-content: center;
      padding: 16px; z-index: 100;
    }
    .modal-backdrop.active { display: flex; }
    .modal {
      background: var(--panel); border: 1px solid #475569;
      border-radius: 14px; max-width: 460px; width: 100%;
      max-height: 88vh; overflow-y: auto; padding: 18px;
      color: var(--text);
    }
    .modal h3 { margin-top: 0; margin-bottom: 12px; }
    .form-row {
      display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px;
    }
    .form-row label { font-size: 0.85rem; color: var(--muted); }
    .form-row input, .form-row select {
      padding: 9px 10px; border-radius: 8px; border: 1px solid #475569;
      background: #0f172a; color: #fff; font-size: 0.95rem;
    }
    .history-list {
      max-height: 240px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 6px;
      font-size: 0.9rem;
    }
    .history-item {
      background: #0f172a; padding: 8px 10px; border-radius: 8px;
      border: 1px solid #334155;
    }
    /* Režim do kapsy */
    .pocket-overlay {
      position: fixed; inset: 0; background: #000; color: #fff;
      display: none; flex-direction: column; align-items: center;
      justify-content: center; z-index: 200; text-align: center; padding: 24px;
    }
    .pocket-overlay.active { display: flex; }
  </style>
</head>
<body>

<div class="app">
  <!-- Horní panel -->
  <div class="topbar">
    <div class="sets-bar" id="setsDisplay">Sety: 0 : 0 (Gemy: 0 : 0)</div>
    <div style="display:flex; gap:6px; flex-wrap:wrap;">
      <button class="btn" id="btnUndo" type="button">↩ Zpět</button>
      <button class="btn" id="btnSettings" type="button">⚙ Hráči & Sety</button>
      <button class="btn" id="btnBt" type="button">🔵 BT & Kapsa</button>
      <button class="btn" id="btnHistory" type="button">📜 Historie</button>
    </div>
  </div>

  <!-- Dvě velké dotykové plochy -->
  <div class="court">
    <div class="half half-p1" id="halfP1">
      <div class="player-header">
        <span id="nameP1">My</span>
        <span class="games-badge" id="gamesP1">Gemy: 0 | Sety: 0</span>
      </div>
      <div class="big-score" id="scoreP1">0</div>
      <div class="tap-hint">Klepni pro bod</div>
    </div>

    <div class="half half-p2" id="halfP2">
      <div class="player-header">
        <span id="nameP2">Soupeř</span>
        <span class="games-badge" id="gamesP2">Gemy: 0 | Sety: 0</span>
      </div>
      <div class="big-score" id="scoreP2">0</div>
      <div class="tap-hint">Klepni pro bod</div>
    </div>
  </div>

  <!-- Spodní panel -->
  <div class="bottombar">
    <div style="display:flex; gap:6px;">
      <button class="btn btn-green" id="btnSpeakNow" type="button">🔊 Ohlásit stav</button>
      <button class="btn" id="btnMute" type="button">🔔 Zvuk: ZAP</button>
    </div>
    <button class="btn btn-red" id="btnReset" type="button">Nový zápas</button>
  </div>
</div>

<!-- Režim do kapsy -->
<div class="pocket-overlay" id="pocketOverlay">
  <h2>🔒 Režim do kapsy aktivní</h2>
  <p style="color:#94a3b8; max-width:320px;">Obrazovka je chráněna proti nechtěným dotykům. Ovládej skóre přes Bluetooth tlačítko.</p>
  <p id="pocketScoreInfo" style="font-size:1.4rem; font-weight:700; margin:16px 0;">0 : 0</p>
  <button class="btn btn-blue" id="btnExitPocket" type="button" style="padding:14px 24px; font-size:1rem;">Odemknout obrazovku</button>
</div>

      <input type="text" id="inputName2" value="Soupeř" />
